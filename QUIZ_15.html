<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm DuckDB & Python Data Processing - UET</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --code-bg: #0f172a;
            --code-text: #e2e8f0;
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #4ade80;
            --error-color: #f87171;
            --code-bg: #090d16;
            --code-text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px 24px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        main {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            margin-bottom: 28px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        pre {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.4;
            border: 1px solid var(--border-color);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            background-color: var(--card-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .option-card:hover {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.03);
        }

        .option-card input {
            margin-right: 14px;
            accent-color: var(--primary-color);
            transform: scale(1.2);
        }

        .option-card.selected {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.08);
        }

        .option-card.correct {
            border-color: var(--success-color) !important;
            background-color: rgba(34, 197, 94, 0.12) !important;
            color: var(--success-color);
        }

        .option-card.incorrect {
            border-color: var(--error-color) !important;
            background-color: rgba(239, 68, 68, 0.12) !important;
            color: var(--error-color);
        }

        .explanation-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background-color: rgba(37, 99, 235, 0.05);
            border-left: 4px solid var(--primary-color);
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.show {
            display: block;
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
        }

        .results-container {
            text-align: center;
            display: none;
        }

        .results-container h2 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: var(--primary-color);
        }

        .score-circle {
            font-size: 3rem;
            font-weight: 700;
            margin: 20px 0;
            color: var(--success-color);
        }

        .question-palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 8px;
            margin-top: 24px;
            margin-bottom: 24px;
        }

        .palette-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .palette-item.current {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;
        }

        .palette-item.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .palette-item.incorrect {
            background-color: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Bộ môn: Lập trình xử lý dữ liệu - DuckDB & Python</h1>
        <div class="header-controls">
            <button class="btn btn-secondary" id="theme-toggle">🌙 Giao diện</button>
            <button class="btn" onclick="resetQuiz làm-lại">Làm lại từ đầu</button>
        </div>
    </header>

    <main id="quiz-main">
        <div class="quiz-info">
            <span id="question-indicator">Câu hỏi 1 / 30</span>
            <span id="score-indicator">Điểm: 0</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="question-container">
            <div class="question-title" id="q-title"></div>
            <pre><code id="q-code"></code></pre>
            <div class="options-grid" id="q-options"></div>
            <button class="btn" id="submit-answer" onclick="checkAnswer()">Nộp bài</button>
            <div class="explanation-box" id="q-explanation"></div>
        </div>

        <div class="navigation-buttons">
            <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()">Câu trước</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo</button>
        </div>

        <!-- Palette of questions -->
        <div class="question-palette" id="question-palette"></div>
    </main>

    <div class="results-container" id="results-container" style="display:none; width:100%; max-width:900px; background:var(--card-bg); border-radius:16px; padding:32px; border:1px solid var(--border-color); box-shadow:0 10px 15px -3px rgba(0,0,0,0.05);">
        <h2>Kết Quả Bài Trắc Nghiệm DuckDB</h2>
        <div class="score-circle" id="final-score">0/30</div>
        <p id="result-message" style="margin-bottom: 24px; font-size: 1.1rem; color: var(--text-muted);"></p>
        <button class="btn" onclick="resetQuiz()">Làm lại bài trắc nghiệm</button>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                title: "Câu 1. (1 điểm) DataFrame df có cột id, khu với bốn hàng (001, A), (002, B), (003, C), (004, A). DataFrame khu_phi có cột khu, phi với hai hàng (A, 20), (B, 5). Bảng kq có bao nhiêu hàng?",
                code: `kq = duckdb.sql("""
    SELECT df.id, khu_phi.phi
    FROM df LEFT JOIN khu_phi ON df.khu = khu_phi.khu
    WHERE khu_phi.phi < 10
""").df()`,
                options: ["A. 2", "B. 1", "C. Báo lỗi", "D. 4"],
                correct: 1, // B. 1
                explanation: "LEFT JOIN giữ lại tất cả hàng từ df (4 hàng). Cột khu_phi.phi tương ứng với các giá trị: A->20, B->5, C->NULL, A->20. Điều kiện WHERE khu_phi.phi < 10 loại bỏ các hàng có giá trị phi không thỏa mãn hoặc NULL (giữ lại hàng với B và phi = 5). Do đó kq chỉ có 1 hàng."
            },
            {
                id: 2,
                title: "Câu 2. (1 điểm) Cho bảng employees gồm cột id, name, salary. Câu lệnh nào dưới đây dùng DuckDB để lấy ra 3 nhân viên có lương cao nhất?",
                code: `kq = duckdb.sql("""
    SELECT * FROM employees ORDER BY salary DESC LIMIT 3
""").df()`,
                options: ["A. SELECT * FROM employees ORDER BY salary ASC LIMIT 3", "B. SELECT * FROM employees ORDER BY salary DESC LIMIT 3", "C. SELECT TOP 3 * FROM employees ORDER BY salary DESC", "D. SELECT * FROM employees WHERE LIMIT 3"],
                correct: 1,
                explanation: "DuckDB sử dụng cú pháp chuẩn SQL bao gồm ORDER BY ... DESC và LIMIT để giới hạn số lượng dòng trả về."
            },
            {
                id: 3,
                title: "Câu 3. (1 điểm) Cho DataFrame df có cột score. Kết quả trả về của câu lệnh DuckDB sau là gì?",
                code: `kq = duckdb.sql("SELECT AVG(score) AS avg_score FROM df").df()`,
                options: [
                    "A. Trả về tổng điểm tất cả các hàng",
                    "B. Trả về giá trị trung bình cộng (average) của cột score",
                    "C. Báo lỗi cú pháp SQL",
                    "D. Trả về giá trị lớn nhất trong cột score"
                ],
                correct: 1,
                explanation: "Hàm AVG() trong SQL dùng để tính giá trị trung bình cộng của một cột số."
            },
            {
                id: 4,
                title: "Câu 4. (1 điểm) Khi thực thi câu lệnh `.df()` sau một câu truy vấn `duckdb.sql(...)`, kết quả trả về có kiểu dữ liệu gì trong Python?",
                code: `kq = duckdb.sql("SELECT * FROM df").df()`,
                options: ["A. list", "B. dict", "C. pandas.DataFrame", "D. numpy.ndarray"],
                correct: 2,
                explanation: "Phương thức `.df()` của DuckDB chuyển kết quả truy vấn trực tiếp thành một `pandas.DataFrame`."
            },
            {
                id: 5,
                title: "Câu 5. (1 điểm) Cho bảng orders với các cột customer_id, amount. Câu lệnh nào tính tổng amount theo từng customer_id?",
                code: `kq = duckdb.sql("""
    SELECT customer_id, SUM(amount) 
    FROM orders 
    GROUP BY customer_id
""").df()`,
                options: [
                    "A. SELECT customer_id, SUM(amount) FROM orders GROUP BY customer_id",
                    "B. SELECT customer_id, TOTAL(amount) FROM orders ORDER BY customer_id",
                    "C. SELECT customer_id, SUM(amount) FROM orders",
                    "D. SELECT SUM(amount) FROM orders BY customer_id"
                ],
                correct: 0,
                explanation: "Để tính tổng theo nhóm, ta kết hợp hàm tổng hợp `SUM()` với mệnh đề `GROUP BY customer_id`."
            },
            {
                id: 6,
                title: "Câu 6. (1 điểm) Đoạn code sau thực hiện điều gì khi truyền một biến pandas DataFrame trực tiếp vào câu truy vấn DuckDB?",
                code: `import duckdb
import pandas as pd
df = pd.DataFrame({'a': [1, 2, 3], 'b': [4, 5, 6]})
kq = duckdb.sql("SELECT SUM(a) FROM df").df()`,
                options: [
                    "A. Báo lỗi do DuckDB không đọc được pandas DataFrame trực tiếp",
                    "B. DuckDB tự động nhận diện biến df trong Python scope và truy vấn trực tiếp trên đó",
                    "C. Chỉ chạy được nếu đăng ký DataFrame bằng lệnh register()",
                    "D. Trả về DataFrame rỗng"
                ],
                correct: 1,
                explanation: "DuckDB hỗ trợ tích hợp nguyên bản với pandas, cho phép truy vấn trực tiếp các biến DataFrame đang có trong môi trường Python mà không cần đăng ký thủ công."
            },
            {
                id: 7,
                title: "Câu 7. (1 điểm) Cho bảng data có cột category và price. Lệnh lọc ra các sản phẩm có price lớn hơn 100 và category là 'Electronics' là:",
                code: `kq = duckdb.sql("""
    SELECT * FROM data 
    WHERE price > 100 AND category = 'Electronics'
""").df()`,
                options: [
                    "A. WHERE price > 100 OR category = 'Electronics'",
                    "B. WHERE price > 100 AND category = 'Electronics'",
                    "C. HAVING price > 100 AND category = 'Electronics'",
                    "D. FILTER price > 100 AND category = 'Electronics'"
                ],
                correct: 1,
                explanation: "Mệnh đề WHERE kết hợp các điều kiện lọc theo dòng sử dụng toán tử AND."
            },
            {
                id: 8,
                title: "Câu 8. (1 điểm) Sự khác biệt chính giữa WHERE và HAVING trong DuckDB/SQL là gì?",
                code: `kq = duckdb.sql("""
    SELECT category, SUM(price) 
    FROM data 
    GROUP BY category 
    HAVING SUM(price) > 500
""").df()`,
                options: [
                    "A. WHERE dùng để lọc dữ liệu trước khi GROUP BY, còn HAVING dùng để lọc sau khi GROUP BY (trên các hàm tổng hợp)",
                    "B. HAVING dùng trước GROUP BY, WHERE dùng sau GROUP BY",
                    "C. Không có sự khác biệt nào",
                    "D. WHERE chỉ dùng cho số, HAVING chỉ dùng cho chuỗi"
                ],
                correct: 0,
                explanation: "WHERE lọc các hàng đơn lẻ trước khi nhóm, trong khi HAVING dùng để lọc các kết quả sau khi đã GROUP BY và tính toán hàm tổng hợp."
            },
            {
                id: 9,
                title: "Câu 9. (1 điểm) Kết quả của hàm COUNT(*) trong câu lệnh SQL sau đếm cái gì?",
                code: `kq = duckdb.sql("SELECT COUNT(*) FROM students").df()`,
                options: [
                    "A. Số lượng cột trong bảng students",
                    "B. Tổng số dòng (hàng) trong bảng students",
                    "C. Số lượng giá trị không trùng lặp",
                    "D. Giá trị lớn nhất của cột id"
                ],
                correct: 1,
                explanation: "COUNT(*) trả về tổng số bản ghi (số hàng) có trong bảng."
            },
            {
                id: 10,
                title: "Câu 10. (1 điểm) Để loại bỏ các dòng có giá trị trùng lặp hoàn toàn trong kết quả trả về của DuckDB, ta dùng từ khóa:",
                code: `kq = duckdb.sql("SELECT DISTINCT city FROM customers").df()`,
                options: [
                    "A. UNIQUE",
                    "B. DISTINCT",
                    "C. DIFFERENT",
                    "D. GROUP"
                ],
                correct: 1,
                explanation: "Từ khóa DISTINCT được đặt sau SELECT để chỉ giữ lại các giá trị duy nhất (không trùng lặp)."
            },
            {
                id: 11,
                title: "Câu 11. (1 điểm) Cho bảng scores gồm các cột name và math. Câu lệnh nào sắp xếp danh sách theo điểm math tăng dần?",
                code: `kq = duckdb.sql("SELECT * FROM scores ORDER BY math ASC").df()`,
                options: [
                    "A. ORDER BY math DESC",
                    "B. ORDER BY math ASC",
                    "C. SORT BY math",
                    "D. ORDER math"
                ],
                correct: 1,
                explanation: "ASC (Ascending) là thứ tự tăng dần (mặc định nếu không viết ASC hay DESC)."
            },
            {
                id: 12,
                title: "Câu 12. (1 điểm) Trong DuckDB, để giới hạn số lượng dòng trả về lấy 10 dòng đầu tiên, ta dùng:",
                code: `kq = duckdb.sql("SELECT * FROM items LIMIT 10").df()`,
                options: [
                    "A. TOP 10",
                    "B. FETCH FIRST 10 ROWS",
                    "C. LIMIT 10",
                    "D. HEAD(10)"
                ],
                correct: 2,
                explanation: "DuckDB hỗ trợ mệnh đề chuẩn `LIMIT 10` để giới hạn số dòng."
            },
            {
                id: 13,
                title: "Câu 13. (1 điểm) Phép JOIN nào trả về tất cả các hàng từ bảng bên trái và các hàng khớp từ bảng bên phải?",
                code: `kq = duckdb.sql("""
    SELECT * FROM tableA LEFT JOIN tableB ON tableA.id = tableB.id
""").df()`,
                options: [
                    "A. INNER JOIN",
                    "B. LEFT JOIN",
                    "C. RIGHT JOIN",
                    "D. FULL OUTER JOIN"
                ],
                correct: 1,
                explanation: "LEFT JOIN giữ toàn bộ dữ liệu bảng bên trái, bảng bên phải nếu không khớp sẽ trả về giá trị NULL."
            },
            {
                id: 14,
                title: "Câu 14. (1 điểm) Khi thực hiện INNER JOIN giữa hai bảng A và B, kết quả sẽ chứa:",
                code: `kq = duckdb.sql("""
    SELECT * FROM A INNER JOIN B ON A.key = B.key
""").df()`,
                options: [
                    "A. Tất cả các hàng của cả hai bảng",
                    "B. Chỉ các hàng có giá trị key khớp nhau ở cả hai bảng",
                    "C. Tất cả hàng của bảng A",
                    "D. Các hàng không khớp nhau"
                ],
                correct: 1,
                explanation: "INNER JOIN chỉ giữ lại các dòng có sự khớp giá trị (match) ở cả hai bảng."
            },
            {
                id: 15,
                title: "Câu 15. (1 điểm) Hàm nào trong DuckDB dùng để thay thế giá trị NULL bằng một giá trị mặc định (ví dụ thay NULL thành 0)?",
                code: `kq = duckdb.sql("SELECT COALESCE(score, 0) FROM students").df()`,
                options: [
                    "A. IFNULL(score, 0) hoặc COALESCE(score, 0)",
                    "B. REPLACE_NULL(score, 0)",
                    "C. ISNULL(score, 0)",
                    "D. FILLNA(score, 0)"
                ],
                correct: 0,
                explanation: "COALESCE (và ISNULL/IFNULL tùy dialect) trả về giá trị đầu tiên không phải NULL trong danh sách tham số."
            },
            {
                id: 16,
                title: "Câu 16. (1 điểm) Câu lệnh SQL nào tính giá trị lớn nhất của cột salary trong bảng staff?",
                code: `kq = duckdb.sql("SELECT MAX(salary) FROM staff").df()`,
                options: [
                    "A. SELECT HIGHEST(salary) FROM staff",
                    "B. SELECT MAX(salary) FROM staff",
                    "C. SELECT TOP(salary) FROM staff",
                    "D. SELECT LIMIT 1 salary FROM staff"
                ],
                correct: 1,
                explanation: "Hàm MAX() trả về giá trị lớn nhất trong một cột."
            },
            {
                id: 17,
                title: "Câu 17. (1 điểm) Kết quả của câu lệnh DuckDB đọc trực tiếp file CSV hoặc Parquet vào DataFrame là:",
                code: `kq = duckdb.sql("SELECT * FROM 'data.csv'").df()`,
                options: [
                    "A. Báo lỗi vì chưa dùng pandas đọc file trước",
                    "B. DuckDB tự động đọc file 'data.csv' và trả về pandas DataFrame",
                    "C. Chỉ đọc được file định dạng parquet",
                    "D. Trả về đường dẫn chuỗi"
                ],
                correct: 1,
                explanation: "DuckDB có khả năng đọc trực tiếp các tệp dữ liệu như CSV, Parquet, JSON mà không cần load thủ công vào pandas trước."
            },
            {
                id: 18,
                title: "Câu 18. (1 điểm) Để tính số lượng giá trị khác nhau (unique count) của cột department trong bảng employees, ta dùng:",
                code: `kq = duckdb.sql("SELECT COUNT(DISTINCT department) FROM employees").df()`,

        let currentQuestion = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let score = 0;
        let isSubmitted = new Array(questions.length).fill(false);

        function initQuiz() {
            renderPalette();
            loadQuestion(currentQuestion);
        }

        function loadQuestion(index) {
            currentQuestion = index;
            const q = questions[index];
            
            document.getElementById('question-indicator').innerText = `Câu hỏi ${index + 1} / ${questions.length}`;
            document.getElementById('score-indicator').innerText = `Điểm: ${score}`;
            document.getElementById('progress-bar').style.width = `${((index + 1) / questions.length) * 100}%`;

            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-code').innerText = q.code;

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, i) => {
                const card = document.createElement('label');
                card.className = 'option-card';
                if (userAnswers[index] === i) {
                    card.classList.add('selected');
                }

                if (isSubmitted[index]) {
                    if (i === q.correct) {
                        card.classList.add('correct');
                    } else if (userAnswers[index] === i && i !== q.correct) {
                        card.classList.add('incorrect');
                    }
                }

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question-${index}`;
                radio.value = i;
                radio.checked = userAnswers[index] === i;
                radio.disabled = isSubmitted[index];
                
                radio.onchange = () => {
                    if (!isSubmitted[index]) {
                        userAnswers[index] = i;
                        updatePaletteItem(index, 'selected');
                        // highlight selected card UI
                        Array.from(optionsContainer.children).forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                    }
                };

                card.appendChild(radio);
                card.appendChild(document.createTextNode(opt));
                optionsContainer.appendChild(card);
            });

            const expBox = document.getElementById('q-explanation');
            if (isSubmitted[index]) {
                expBox.innerText = `💡 Giải thích: ${q.explanation}`;
                expBox.classList.add('show');
                document.getElementById('submit-answer').style.display = 'none';
            } else {
                expBox.classList.remove('show');
                document.getElementById('submit-answer').style.display = 'block';
            }

            document.getElementById('prev-btn').style.display = index === 0 ? 'none' : 'block';
            document.getElementById('next-btn').innerText = index === questions.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';
            updatePalette();
        }

        function checkAnswer() {
            if (userAnswers[currentQuestion] === null) {
                alert('Vui lòng chọn một đáp án trước khi nộp bài!');
                return;
            }

            if (!isSubmitted[currentQuestion]) {
                isSubmitted[currentQuestion] = true;
                if (userAnswers[currentQuestion] === questions[currentQuestion].correct) {
                    score += 1;
                }
                loadQuestion(currentQuestion);
                updatePaletteItem(currentQuestion, userAnswers[currentQuestion] === questions[currentQuestion].correct ? 'correct' : 'incorrect');
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                loadQuestion(currentQuestion + 1);
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                loadQuestion(currentQuestion - 1);
            }
        }

        function renderPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';
            questions.forEach((_, i) => {
                const item = document.createElement('div');
                item.className = 'palette-item';
                item.innerText = i + 1;
                if (i === currentQuestion) item.classList.add('current');
                if (isSubmitted[i]) {
                    item.classList.add(userAnswers[i] === questions[i].correct ? 'correct' : 'incorrect');
                }
                item.onclick = () => loadQuestion(i);
                palette.appendChild(item);
            });
        }

        function updatePalette() {
            const palette = document.getElementById('question-palette');
            Array.from(palette.children).forEach((item, i) => {
                item.className = 'palette-item';
                if (i === currentQuestion) item.classList.add('current');
                if (isSubmitted[i]) {
                    item.classList.add(userAnswers[i] === questions[i].correct ? 'correct' : 'incorrect');
                }
            });
        }

        function updatePaletteItem(index, status) {
            updatePalette();
        }

        function showResults() {
            document.getElementById('quiz-main').style.display = 'none';
            const resContainer = document.getElementById('results-container');
            resContainer.style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
            
            let msg = "";
            const pct = (score / questions.length) * 100;
            if (pct >= 90) msg = "Xuất sắc! Thầy đánh giá rất cao tư duy xử lý dữ liệu và DuckDB của em.";
            else if (pct >= 70) msg = "Khá tốt! Em đã nắm vững phần lớn kiến thức về DuckDB và cú pháp SQL trong Python.";
            else msg = "Cần cố gắng ôn tập thêm các câu lệnh SQL và các phép JOIN trong DuckDB nhé!";
            document.getElementById('result-message').innerText = msg;
        }

        function resetQuiz() {
            currentQuestion = 0;
            userAnswers = new Array(questions.length).fill(null);
            score = 0;
            isSubmitted = new Array(questions.length).fill(false);
            document.getElementById('quiz-main').style.display = 'block';
            document.getElementById('results-container').style.display = 'none';
            initQuiz();
        }

        // Theme toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.onclick = () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggleBtn.innerText = '🌙 Giao diện';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.innerText = '☀️ Giao diện';
            }
        };

        window.onload = initQuiz;
    </script>
