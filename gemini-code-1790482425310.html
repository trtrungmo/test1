                id: 14,
                type: 'essay',
                topic: 'Bài 3: Chuẩn hóa Z-score với NumPy std',
                question: 'Điểm của 7 bài kiểm tra là 2, 4, 6, 8, 10, 12, 14. Chuẩn hoá bằng z-score với độ lệch chuẩn tổng thể (chia cho n, như std() mặc định của NumPy). Điểm z của bài 14 điểm bằng bao nhiêu? Chỉ trả lời bằng một con số.',
                modelAnswer: '1.5',
                explanation: 'Giải thích chi tiết:\n1. Giá trị trung bình mean = (2 + 4 + 6 + 8 + 10 + 12 + 14) / 7 = 56 / 7 = 8.\n2. Các độ lệch so với mean: [-6, -4, -2, 0, 2, 4, 6].\n3. Bình phương độ lệch: [36, 16, 4, 0, 4, 16, 36]. Tổng = 112.\n4. Phương sai variance = 112 / 7 = 16.\n5. Độ lệch chuẩn std = sqrt(16) = 4.\n6. Điểm Z của bài 14: z = (x - mean) / std = (14 - 8) / 4 = 6 / 4 = 1.5.'
            },
            {
                id: 15,
                type: 'essay',
                topic: 'Bài 1: Giá trị Chân lý (Truthy / Falsy) & Lọc Dictionary',
                question: 'Đoạn code tính điểm trung bình của các sinh viên "có điểm", nhưng điều kiện lọc dùng if v. Chỉ trả lời bằng một con số là giá trị được in ra.\n\ndiem = {"An": 8, "Bình": 0, "Chi": None, "Dũng": 6, "Em": 0}\nco_diem = {k: v for k, v in diem.items() if v}\nprint(sum(co_diem.values()) / len(co_diem))',
                modelAnswer: '7',
                explanation: 'Giải thích chi tiết:\n1. Trong Python, giá trị 0 và None đều được coi là Falsy (coi như False trong mệnh đề `if v`).\n2. Do đó, điều kiện `if v` sẽ loại bỏ cả "Chi" (None) và "Bình", "Em" (điểm 0!).\n3. Dictionary `co_diem` chỉ còn lại: {"An": 8, "Dũng": 6}.\n4. Tổng điểm: 8 + 6 = 14. Số lượng phần tử: 2.\n5. Trung bình = 14 / 2 = 7.'
            },

            // ================= CAU HOI PHAN LUONG ON TAP BO SUNG =================
            {
                id: 16,
                type: 'mcq',
                topic: 'Bài 3: Tạo mảng NumPy & Kiểu dữ liệu ngầm định',
                question: 'Cho đoạn code NumPy sau:\na = np.array([1, 2, 3.0, 4])\nKiểu dữ liệu (dtype) của mảng `a` sẽ là gì?',
                options: [
                    'int64',
                    'float64',
                    'object',
                    'string'
                ],
                correct: 1,
                explanation: 'NumPy yêu cầu mọi phần tử trong mảng phải cùng kiểu dữ liệu. Do trong danh sách có phần tử 3.0 (float), NumPy sẽ tự động ép kiểu tất cả các phần tử còn lại sang float64.'
            },
            {
                id: 17,
                type: 'mcq',
                topic: 'Bài 2: Đọc file JSON với thư viện json',
                question: 'Khi sử dụng hàm `json.load(f)` để đọc dữ liệu từ một file JSON đang mở `f`, dữ liệu kiểu JSON Object `{ "name": "An", "age": 20 }` sẽ được chuyển đổi thành cấu trúc dữ liệu nào trong Python?',
                options: [
                    'List',
                    'Tuple',
                    'Dictionary',
                    'Set'
                ],
                correct: 2,
                explanation: 'Trong Python, mô đun `json` tự động ánh xạ JSON Object thành kiểu `dict` (dictionary) và JSON Array thành `list`.'
            },
            {
                id: 18,
                type: 'essay',
                topic: 'Bài 3: Phép toán trên mảng Boolean NumPy',
                question: 'Cho mảng x = np.array([10, 25, 30, 45, 50]). Tính giá trị biểu thức: np.sum((x > 20) & (x < 50)). Chỉ trả lời bằng một con số.',
                modelAnswer: '3',
                explanation: 'Giải thích chi tiết:\n1. Điều kiện (x > 20) tạo mảng bool: [False, True, True, True, True]\n2. Điều kiện (x < 50) tạo mảng bool: [True, True, True, True, False]\n3. Kết hợp logic &: [False, True, True, True, False] (các giá trị 25, 30, 45 thỏa mãn)\n4. np.sum() đếm số phần tử True => Kết quả bằng 3.'
            }
        ];

        let questions = JSON.parse(JSON.stringify(rawQuestions));
        let currentFilter = 'all';
        let userAnswers = {};

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const filtered = questions.filter(q => {
                if (currentFilter === 'mcq') return q.type === 'mcq';
                if (currentFilter === 'essay') return q.type === 'essay';
                return true;
            });

            filtered.forEach((q, idx) => {
                const qCard = document.createElement('div');
                qCard.className = 'bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg relative transition';
                qCard.id = `card-${q.id}`;

                let html = `
                    <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-700 text-sky-300">Câu ${idx + 1} (${q.type === 'mcq' ? 'Trắc nghiệm' : 'Tự luận'})</span>
                        <span class="text-xs font-mono text-amber-400 bg-amber-950/60 border border-amber-800/60 px-2 py-0.5 rounded"><i class="fa-solid fa-book-bookmark mr-1"></i>${q.topic}</span>
                    </div>
                    <div class="text-slate-100 font-medium mb-4 whitespace-pre-wrap leading-relaxed">${escapeHtml(q.question)}</div>
                `;

                if (q.type === 'mcq') {
                    html += `<div class="space-y-2 mb-4">`;
                    q.options.forEach((opt, oIdx) => {
                        const isSelected = userAnswers[q.id] === oIdx;
                        let btnStyle = 'bg-slate-700/50 hover:bg-slate-700 text-slate-200 border-slate-600';
                        
                        if (userAnswers[q.id] !== undefined) {
                            if (oIdx === q.correct) {
                                btnStyle = 'bg-emerald-900/60 text-emerald-200 border-emerald-500 font-semibold';
                            } else if (isSelected) {
                                btnStyle = 'bg-rose-900/60 text-rose-200 border-rose-500';
                            }
                        }

                        html += `
                            <button onclick="selectMcq(${q.id}, ${oIdx})" ${userAnswers[q.id] !== undefined ? 'disabled' : ''} 
                                class="w-full text-left p-3 rounded-lg border ${btnStyle} transition flex items-start gap-3 text-sm">
                                <span class="font-bold border rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mt-0.5 border-current">
                                    ${String.fromCharCode(65 + oIdx)}
                                </span>
                                <span class="whitespace-pre-wrap">${escapeHtml(opt)}</span>
                            </button>
                        `;
                    });
                    html += `</div>`;
                } else {
                    const savedText = userAnswers[q.id] || '';
                    html += `
                        <div class="mb-4">
                            <textarea id="input-${q.id}" oninput="saveEssay(${q.id}, this.value)" rows="3" 
                                placeholder="Nhập câu trả lời hoặc đáp số của bạn ở đây..." 
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-sky-500 transition">${savedText}</textarea>
                        </div>
                    `;
                }

                // Answer / Explanation Section
                const isAnswered = userAnswers[q.id] !== undefined;
                const showExp = isAnswered || userAnswers[`show_${q.id}`];

                html += `
                    <div id="exp-container-${q.id}" class="${showExp ? '' : 'hidden'} mt-4">
                        <div class="p-4 rounded-lg bg-slate-900/90 border border-sky-800/50 text-sm text-slate-300 space-y-2">
                            ${q.type === 'essay' ? `<div class="font-bold text-amber-400 mb-1">Đáp án mẫu / Kết quả: <span class="text-white font-mono bg-slate-800 px-2 py-0.5 rounded">${escapeHtml(q.modelAnswer)}</span></div>` : ''}
                            <div class="font-semibold text-sky-400 border-b border-slate-800 pb-1 flex items-center gap-2">
                                <i class="fa-solid fa-circle-info"></i> Giải thích chi tiết & Căn cứ kiến thức:
                            </div>
                            <div class="whitespace-pre-wrap text-xs sm:text-sm text-slate-300 leading-relaxed">${escapeHtml(q.explanation)}</div>
                        </div>
                    </div>
                `;

                if (q.type === 'essay' && !isAnswered) {
                    html += `
                        <button onclick="toggleAnswer(${q.id})" class="mt-2 text-xs text-sky-400 hover:text-sky-300 font-semibold underline flex items-center gap-1">
                            <i class="fa-solid fa-eye"></i> ${userAnswers[`show_${q.id}`] ? 'Ẩn đáp án' : 'Hiện đáp án & giải thích'}
                        </button>
                    `;
                }

                qCard.innerHTML = html;
                container.appendChild(qCard);
            });

            updateStats();
        }

        function selectMcq(qId, optionIdx) {
            userAnswers[qId] = optionIdx;
            renderQuestions();
        }

        function saveEssay(qId, val) {
            if (val.trim()) {
                userAnswers[qId] = val;
            } else {
                delete userAnswers[qId];
            }
            updateStats();
        }

        function toggleAnswer(qId) {
            userAnswers[`show_${qId}`] = !userAnswers[`show_${qId}`];
            renderQuestions();
        }

        function filterType(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-sky-600', 'text-white');
                b.classList.add('bg-slate-700', 'text-slate-300');
            });
            document.getElementById(`btn-${type}`).classList.add('bg-sky-600', 'text-white');
            document.getElementById(`btn-${type}`).classList.remove('bg-slate-700', 'text-slate-300');
            renderQuestions();
        }

        function shuffleQuestions() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            renderQuestions();
        }

        function resetAll() {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ câu trả lời để làm lại từ đầu?")) {
                userAnswers = {};
                questions = JSON.parse(JSON.stringify(rawQuestions));
                renderQuestions();
            }
        }

        function updateStats() {
            const total = questions.length;
            const mcqCount = questions.filter(q => q.type === 'mcq').length;
            const essayCount = questions.filter(q => q.type === 'essay').length;

            document.getElementById('cnt-all').innerText = total;
            document.getElementById('cnt-mcq').innerText = mcqCount;
            document.getElementById('cnt-essay').innerText = essayCount;

            const completed = Object.keys(userAnswers).filter(k => !k.startsWith('show_')).length;
            document.getElementById('completedCount').innerText = completed;
            document.getElementById('totalCount').innerText = total;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize App
        window.onload = () => {
            renderQuestions();
        };
    </script>
</body>
</html>
